[project]
name = "direitos"
version = "0.1.0"
description = ""
authors = [
    {name = "Cadu",email = "cadums013@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard] (>=0.143.0,<0.144.0)",
    "sqlalchemy (>=2.1.4,<3.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "alembic (>=1.20.0,<2.0.0)",
    "psycopg[binary] (>=3.3.6,<4.0.0)"
]

[tool.poetry]
packages = [{include = "direitos", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.14,<4.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.taskipy.tasks]
run = "fastapi dev src/direitos/app.py"
pre-format = "ruff check --fix"
format = "ruff format ."
lint = "ruff check ."


[tool.ruff]
line-length=79
extend-exclude=['migrations']

[tool.ruff.lint]
preview=true
select=["E", "F","I","B","PL", "PT", "FAST"] 

[dependency-groups]
dev = [
    "taskipy (>=1.14.1,<2.0.0)",
    "ruff (>=0.17.0,<0.18.0)"
]
